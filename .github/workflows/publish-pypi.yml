name: publish-pypi

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sovereign-fleet/
    permissions:
      id-token: write # Mandatory for PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build package
        run: uv build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # skip-existing: true ensures idempotent publishes
          skip-existing: true
