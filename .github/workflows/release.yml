name: release

# A tag v*.*.* builds the package and creates a GitHub release whose notes are
# that version's CHANGELOG.md section. No PyPI publish yet.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build pytest ruff
          pip install -e ".[dev]"
      - name: run tests
        run: python -m pytest -q tests/test_bump_version.py
      - name: build sdist and wheel
        run: python -m build
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Sovereign Fleet $GITHUB_REF_NAME" --notes-file notes.md --verify-tag dist/*
          fi
      # TODO: publish to PyPI when ready
      # - name: publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     password: ${{ secrets.PYPI_API_TOKEN }}