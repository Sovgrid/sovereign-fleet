name: Feature Request
description: Suggest an idea or enhancement for Sovereign Fleet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Proposals should align with sovereign local execution, verified gates, or pluggable harnesses.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should Sovereign Fleet address this?
    validations:
      required: true
