<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fleet task</title>
<style>
:root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6a6860; --line:#dcd9d0; --accent:#9a5b00; --ok:#1f7a3d; --warn:#9a5b00; --bad:#b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg:#1c1b19; --fg:#ecebe6; --muted:#a09d93; --line:#3a3833; --accent:#e0af68; --ok:#6cc58a; --warn:#e0af68; --bad:#f2928b; } }
* { box-sizing: border-box; }
body { margin:0; padding:14px; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
h1 { font-size:16px; margin:0 0 8px; overflow-wrap:anywhere; }
.badge { display:inline-block; padding:1px 8px; border:1px solid var(--line); border-radius:10px; font-size:12px; }
.badge.ok { color:var(--ok); } .badge.warn { color:var(--warn); } .badge.bad { color:var(--bad); }
dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 12px; margin:10px 0; }
dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
.links { margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
a.link { color:var(--accent); border:1px solid var(--accent); border-radius:6px; padding:5px 12px; text-decoration:none; }
a.link:focus-visible, a.link:hover { background:var(--line); }
</style>
</head>
<body>
<main>
  <h1 id="title">Waiting for the task.</h1>
  <p><span class="badge" id="status"></span></p>
  <dl id="facts"></dl>
  <div class="links" id="links"></div>
</main>
<script>
(function () {
  "use strict";
  var nextId = 1, pending = {}, lastHeight = 0;
  function send(msg) { window.parent.postMessage(msg, "*"); }
  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, fail) { pending[id] = { resolve: resolve, fail: fail }; send({ jsonrpc: "2.0", id: id, method: method, params: params }); });
  }
  function text(tag, value, cls) { var e = document.createElement(tag); e.textContent = String(value); if (cls) { e.className = cls; } return e; }
  function allowed(url, protocols) { var m = /^([a-z][a-z0-9+.-]*:)/i.exec(url); return !!m && protocols.indexOf(m[1].toLowerCase()) >= 0; }
  function link(label, url, protocols) {
    if (typeof url !== "string" || !allowed(url, protocols)) { return null; }
    var a = text("a", label, "link");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.addEventListener("click", function (ev) { ev.preventDefault(); request("ui/open-link", { url: url }).catch(function () {}); });
    return a;
  }
  function notifySize() {
    var main = document.querySelector("main");
    var raw = main ? (main.getBoundingClientRect().height + 32) : (document.body ? document.body.offsetHeight + 4 : 180);
    var h = Math.max(120, Math.min(Math.ceil(raw), 1600));
    if (h === lastHeight) { return; }
    lastHeight = h;
    send({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { height: h } });
  }
  function render(data) {
    if (!data || typeof data !== "object") { return; }
    document.getElementById("title").textContent = String(data.title || data.task_id || "Task");
    var st = document.getElementById("status"), s = String(data.status || "unknown");
    st.textContent = s;
    st.className = "badge " + (s === "completed" ? "ok" : (s === "failed" || s === "cancelled" ? "bad" : "warn"));
    var files = (data.changed_files === null || data.changed_files === undefined) ? "not known" : data.changed_files;
    var rows = [["Task", data.task_id], ["Lane", data.lane || "auto"], ["Project", data.project || "none"],
                ["Changed files", files], ["Landing", data.landing || "not landed"]];
    var dl = document.getElementById("facts"); dl.textContent = "";
    rows.forEach(function (r) { dl.appendChild(text("dt", r[0])); dl.appendChild(text("dd", r[1] === undefined || r[1] === null ? "" : r[1])); });
    var box = document.getElementById("links"); box.textContent = "";
    var links = data.links || {};
    var open = link("Open in fleet", links.fleet, ["http:", "https:"]);
    if (open) { box.appendChild(open); }
    notifySize();
    if (window.requestAnimationFrame) { window.requestAnimationFrame(notifySize); }
  }
  window.addEventListener("resize", notifySize);
  window.addEventListener("message", function (ev) {
    if (ev.source !== window.parent) { return; }
    var m = ev.data;
    if (!m || m.jsonrpc !== "2.0") { return; }
    if (m.id !== undefined && !m.method && pending[m.id]) {
      var p = pending[m.id]; delete pending[m.id];
      if (m.error) { p.fail(m.error); } else { p.resolve(m.result); }
      return;
    }
    if (m.method === "ui/notifications/tool-result" && m.params) { render(m.params.structuredContent); }
  });
  request("ui/initialize", { protocolVersion: "2025-11-21", appInfo: { name: "fleet-task-card", version: "1" }, appCapabilities: {} })
    .then(function () { send({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }); notifySize(); })
    .catch(function () {});
})();
</script>
</body>
</html>
